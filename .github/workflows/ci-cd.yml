name: CI

# Runs on every push and PR. Deliberately fast: no Docker build, no E2E.
# STACK: React 19 + TS | FastAPI | PostgreSQL 16 | Redis 7 + RQ.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20.19.0"

jobs:
  security:
    name: Security Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan working tree for credentials
        run: python scripts/check_secrets.py --worktree

  api:
    name: API (lint, format, schema, test)
    runs-on: ubuntu-latest
    needs: security

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caprep
          POSTGRES_PASSWORD: caprep
          POSTGRES_DB: caprep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caprep -d caprep_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://caprep:caprep@localhost:5432/caprep_test
      TEST_DATABASE_URL: postgresql://caprep:caprep@localhost:5432/caprep_test
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - name: Install system dependencies
        # Needed by the OCR tests. pdf2image shells out to pdftoppm and
        # pytesseract shells out to tesseract; pip installing the Python
        # packages alone leaves both missing, and those tests would skip
        # silently in CI - which is worse than failing, because it looks green.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr tesseract-ocr-eng poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Apply migrations
        # Proves the migration chain runs from empty, which a "models import
        # fine" check does not.
        run: alembic upgrade head

      - name: Check for model/migration drift
        run: alembic check

      - name: Test backend suite
        # Canonical gate: plain pytest (strict-markers from pytest.ini stay
        # on). No --cov flags: fail_under=80 is a separate pre-existing gap
        # (current total is lower), so gating merges on it would hold CI red
        # for reasons unrelated to the change under test.
        run: pytest -q -rs

  migrations-are-reversible:
    name: Migrations are reversible
    runs-on: ubuntu-latest
    needs: api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: caprep
          POSTGRES_PASSWORD: caprep
          POSTGRES_DB: caprep_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caprep -d caprep_test"
          --health-interval 5s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql+psycopg://caprep:caprep@localhost:5432/caprep_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Upgrade then downgrade
        # A downgrade path that has never been executed is not a downgrade path.
        # This catches the common case of a migration that drops a column on the
        # way up but cannot restore it on the way down.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    needs: security
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # `tsc -b && vite build`. A build failure here is the same failure
        # Vercel would hit, so it is caught before the deploy rather than after.
        # Build-time placeholders only: Vite inlines VITE_ vars, and the
        # Supabase client needs a real-shaped https URL to initialise. The
        # anon key is a non-secret placeholder; real values live in Vercel.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://zyrmlnpvylhcpyaoizyz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
