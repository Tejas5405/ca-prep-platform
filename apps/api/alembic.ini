; Alembic configuration.
;
; The database URL is deliberately NOT set here. It is read from the
; DATABASE_URL environment variable in alembic/env.py, because a connection
; string with credentials committed to a repository is a credential leak, and
; Render injects DATABASE_URL at runtime.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Timestamped revision filenames so ordering is obvious in a directory listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
