[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
# The database-backed suite needs a live PostgreSQL, so it is the one thing in
# this repo that is skipped rather than run when the environment is incomplete:
#
#     TEST_DATABASE_URL=postgresql://postgres@127.0.0.1:5433/caprep_test pytest
#
# The marker is registered because --strict-markers is on, which is why an
# unregistered one is a collection ERROR rather than a warning. It went
# unnoticed for a while because the marker was used in files that were only
# collected when the database was reachable.
markers =
    postgres: requires a live PostgreSQL (see tests/integration)
    rate_limiter: this test exercises the rate limiter itself, so the
        conftest fixture that disables it for the rest of the suite stands down

filterwarnings =
    error::DeprecationWarning:app.*
